# Agent Sandboxing overlay (microsandbox / msb)
# Grants the container KVM access and persists microsandbox state so OpenCode
# agent commands can run inside a microVM. Linux host with /dev/kvm required.
# Use with: docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d

services:
  app:
    privileged: true
    devices:
      - "/dev/kvm:/dev/kvm"
    environment:
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-node:24}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-4G}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-2}
      - SANDBOX_EXEC_USER=${SANDBOX_EXEC_USER:-${PUID:-1000}}
      - SANDBOX_NET=${SANDBOX_NET:-public}
      - SANDBOX_START_TIMEOUT_MS=${SANDBOX_START_TIMEOUT_MS:-300000}
      - SANDBOX_EXEC_TIMEOUT_MS=${SANDBOX_EXEC_TIMEOUT_MS:-600000}
    volumes:
      - microsandbox-data:/home/node/.microsandbox

volumes:
  microsandbox-data:
    driver: local
