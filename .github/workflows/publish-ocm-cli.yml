name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ocm-cli, shared]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        working-directory: ${{ matrix.package }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.pkg.outputs.version }} already on npm; skipping publish."
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.pkg.outputs.version }} not yet on npm; will publish."
          fi

      - name: Build
        if: steps.check.outputs.already_published == 'false' && matrix.package == 'ocm-cli'
        working-directory: ${{ matrix.package }}
        run: bun scripts/build.ts

      - name: Publish to npm
        if: steps.check.outputs.already_published == 'false'
        working-directory: ${{ matrix.package }}
        run: pnpm publish --access public --no-git-checks
