name: Sync upstream

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to merge from
        required: false
        default: main
      base_branch:
        description: Branch in this fork to merge into
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          UPSTREAM_REPO: chriswritescode-dev/opencode-manager
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
          BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
          SYNC_BRANCH: chore/sync-upstream
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/sync-upstream.sh
